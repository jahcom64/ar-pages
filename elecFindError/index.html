<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微電車法規 大家來找碴 (測驗模式)</title>
    <style>
        /* 網頁基本設定 */
        body {
            font-family: '微軟正黑體', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        /* 控制按鈕區塊 */
        .controls {
            margin-bottom: 20px;
        }

        .controls button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #show-answer-btn {
            background-color: #007bff;
            color: white;
        }

        #show-answer-btn:hover {
            background-color: #0056b3;
        }

        #reset-btn {
            background-color: #28a745;
            color: white;
        }

        #reset-btn:hover {
            background-color: #1e7e34;
        }

        /* 圖片容器：用於定位熱點 */
        .image-container {
            position: relative;
            width: 800px;
            max-width: 90%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 原始圖片 */
        .image-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 熱點區域的基本樣式 */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            box-sizing: border-box;
            background-color: transparent;
            /* 隱藏熱點邊框，除非需要除錯 */
            /* border: 3px solid rgba(0, 0, 0, 0.2); */
        }
        
        /* 熱點 1：男孩頭部 (安全帽) */
        #hotspot-boy {
            top: 30%; 
            left: 30%; 
            width: 25%; 
            height: 35%;
        }
        
        /* 熱點 2：小女孩 (載人) */
        #hotspot-girl {
            top: 40%;
            left: 45%;
            width: 20%;
            height: 45%;
        }

        /* 提示框的基本樣式 */
        .popup {
            position: absolute;
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            
            padding: 15px;
            border-radius: 50%; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
            z-index: 10;
            width: 180px; 
            height: 180px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
        }
        
        /* 提示框 1：男孩的 (紅色邊框) */
        #popup-boy {
            border: 5px solid red;
            color: red;
            top: 5%;
            left: 5%;
        }

        /* 提示框 2：女孩的 (藍色邊框) */
        #popup-girl {
            border: 5px solid blue;
            color: blue;
            top: 55%;
            left: 55%;
        }
        
        /* 顯示狀態 */
        .popup.visible {
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <div class="controls">
        <button id="show-answer-btn" onclick="showAllPopups()">顯示答案</button>
        <button id="reset-btn" onclick="hideAllPopups()">再測驗一次</button>
    </div>

    <div class="image-container">
        <img src="elecBg.jpg" alt="微電車安全宣導圖片">

        <div class="hotspot" id="hotspot-boy" onclick="showPopup('popup-boy')"></div>

        <div class="hotspot" id="hotspot-girl" onclick="showPopup('popup-girl')"></div>

        <div class="popup" id="popup-boy">
            騎微電車<br>**需戴安全帽**
        </div>

        <div class="popup" id="popup-girl">
            騎微電車<br>**不得載人**
        </div>

    </div>

    <script>
        // 獲取所有提示框元素
        const popups = document.querySelectorAll('.popup');

        /**
         * 函數：顯示單一提示框 (點擊熱點時呼叫)
         * - 由於需求是不再隱藏，因此我們直接添加 'visible' 類別。
         */
        function showPopup(popupId) {
            const popup = document.getElementById(popupId);
            // 點擊後，直接將它設置為顯示狀態
            popup.classList.add('visible');
        }

        /**
         * 函數：顯示所有提示框 (點擊「顯示答案」時呼叫)
         */
        function showAllPopups() {
            popups.forEach(popup => {
                popup.classList.add('visible');
            });
            alert('答案已顯示！');
        }

        /**
         * 函數：隱藏所有提示框 (點擊「再測驗一次」時呼叫)
         */
        function hideAllPopups() {
            popups.forEach(popup => {
                popup.classList.remove('visible');
            });
            alert('所有答案已清除，請重新開始測驗！');
        }
        
        // 額外功能：點擊提示框以外的區域不再影響提示框狀態，
        // 使用者只能透過點擊熱點或「再測驗一次」來控制。
        
    </script>

</body>
</html>
