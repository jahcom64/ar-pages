<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微電車法規 大家來找碴 (點擊顯示)</title>
    <style>
        /* 網頁基本設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        /* 圖片容器：用於定位熱點 */
        .image-container {
            position: relative;
            width: 800px;
            max-width: 90%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 原始圖片 */
        .image-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 熱點區域的基本樣式 */
        .hotspot {
            position: absolute;
            cursor: pointer;
            /* 邊框僅用於開發/測試時，確定點擊範圍。正式版本通常會註釋或移除 */
            border: 3px solid rgba(0, 0, 0, 0.2); 
            border-radius: 50%;
            box-sizing: border-box;
            background-color: transparent;
        }

        .hotspot:hover {
            border-color: rgba(0, 0, 255, 0.5);
        }

        /* 熱點 1：男孩頭部 (安全帽) */
        #hotspot-boy {
            top: 30%; 
            left: 30%; 
            width: 25%; 
            height: 35%;
        }
        
        /* 熱點 2：小女孩 (載人) */
        #hotspot-girl {
            top: 40%;
            left: 45%;
            width: 20%;
            height: 45%;
        }

        /* 提示框的基本樣式 */
        .popup {
            position: absolute;
            /* **關鍵修改：使用 opacity 和 visibility 預設隱藏** */
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s; /* 加入過渡效果 */
            
            padding: 15px;
            border-radius: 50%; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
            z-index: 10;
            width: 180px; 
            height: 180px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
        }
        
        /* 提示框 1：男孩的 (紅色邊框) */
        #popup-boy {
            border: 5px solid red;
            color: red;
            top: 5%;
            left: 5%;
        }

        /* 提示框 2：女孩的 (藍色邊框) */
        #popup-girl {
            border: 5px solid blue;
            color: blue;
            top: 55%;
            left: 55%;
        }
        
        /* 顯示狀態 */
        .popup.visible {
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <div class="image-container">
        <img src="elecBg.jpg" alt="微電車安全宣導圖片">

        <div class="hotspot" id="hotspot-boy" onclick="togglePopup('popup-boy')"></div>

        <div class="hotspot" id="hotspot-girl" onclick="togglePopup('popup-girl')"></div>

        <div class="popup" id="popup-boy">
            騎微電車<br>**需戴安全帽**
        </div>

        <div class="popup" id="popup-girl">
            騎微電車<br>**不得載人**
        </div>

    </div>

    <script>
        // JavaScript 函數：用來切換提示框的顯示/隱藏
        function togglePopup(popupId) {
            const popup = document.getElementById(popupId);
            
            // 檢查是否已經顯示 (擁有 'visible' 類別)
            const isVisible = popup.classList.contains('visible');

            // 隱藏所有其他的提示框
            document.querySelectorAll('.popup').forEach(p => {
                p.classList.remove('visible');
            });

            // 如果原本是隱藏的，現在就顯示它 (加入 'visible' 類別)
            if (!isVisible) {
                popup.classList.add('visible');
            }
            // 如果原本就是顯示的，上面的步驟已經把它隱藏了 (因為先移除了所有 visible 類別，然後沒再加回去)
        }

        // 當點擊圖片容器以外的區域時，隱藏所有提示框 (讓使用者能關閉提示)
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.image-container');
            const hotspots = document.querySelectorAll('.hotspot');
            
            // 檢查點擊是否發生在熱點區域或提示框上
            let isTargetRelevant = false;
            if (container.contains(event.target)) {
                // 如果點擊在容器內部，且不是圖片本身，則可能是熱點或提示框
                if (event.target.classList.contains('hotspot') || event.target.closest('.popup')) {
                    isTargetRelevant = true;
                }
            }

            // 如果點擊目標不是熱點也不是提示框，則隱藏所有提示
            if (!isTargetRelevant) {
                document.querySelectorAll('.popup').forEach(p => {
                    p.classList.remove('visible');
                });
            }
        });
        
    </script>

</body>
</html>
