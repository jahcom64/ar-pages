<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手機照片貼圖合成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --primary: #4a90e2; --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* 標題與按鈕區 */
        header { width: 100%; padding: 15px; text-align: center; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; gap: 8px; padding: 15px; flex-wrap: wrap; justify-content: center; }
        button { border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-upload { background: var(--primary); color: white; }
        .btn-download { background: var(--success); color: white; }
        .btn-share { background: #8e44ad; color: white; }
        
        /* 畫布容器 */
        #canvas-wrapper { background: #ddd; margin: 10px auto; border-radius: 8px; overflow: hidden; line-height: 0; }
        
        /* 貼圖選單 */
        .sticker-label { font-size: 14px; color: #666; margin-top: 10px; }
        .sticker-bank { display: flex; gap: 12px; overflow-x: auto; width: 90%; padding: 15px; -webkit-overflow-scrolling: touch; }
        .sticker-bank img { width: 70px; height: 70px; background: white; border-radius: 8px; border: 2px solid transparent; flex-shrink: 0; object-fit: contain; }
        .sticker-bank img:active { border-color: var(--primary); transform: scale(0.9); }
    </style>
</head>
<body>

<header><h3>📷 相片裝飾工坊</h3></header>

<div class="btn-group">
    <input type="file" id="upload-photo" accept="image/*" style="display:none">
    <button class="btn-upload" onclick="document.getElementById('upload-photo').click()">📸 拍/選照片</button>
    <button id="download-btn" class="btn-download">💾 儲存</button>
    <button id="share-btn" class="btn-share">📤 分享</button>
</div>

<div id="canvas-wrapper">
    <canvas id="c"></canvas>
</div>

<div class="sticker-label">請先拍照後，點擊下方👇貼圖加入照片：</div>
<div class="sticker-bank" id="sticker-list">
    <img src="stickers/boyChicken.png" onclick="addSticker(this.src)">
    <img src="stickers/smile.png" onclick="addSticker(this.src)">
    <img src="stickers/chickenLeg.png" onclick="addSticker(this.src)">
    <img src="stickers/driverLic.png" onclick="addSticker(this.src)">
    <img src="stickers/noMore.png" onclick="addSticker(this.src)">
</div>

<script>
const canvas = new fabric.Canvas('c');
    let originalWidth = 0; // 用於紀錄原始照片寬度

    // 1. 上傳底圖並設定解析度參考
    document.getElementById('upload-photo').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(f) {
            const imgObj = new Image();
            imgObj.onload = function() {
                // 儲存原始尺寸
                originalWidth = imgObj.width;
                const originalHeight = imgObj.height;

                // 顯示用的畫布大小 (維持手機流暢度)
                const displayWidth = Math.min(window.innerWidth - 30, 500);
                const scaleRatio = displayWidth / originalWidth;
                const displayHeight = originalHeight * scaleRatio;

                canvas.setWidth(displayWidth);
                canvas.setHeight(displayHeight);

                // 將圖片設為底圖，並填滿畫布
                fabric.Image.fromURL(f.target.result, function(img) {
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: canvas.width / img.width,
                        scaleY: canvas.height / img.height
                    });
                });
            };
            imgObj.src = f.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 2. 加入貼圖 (不變)
    function addSticker(url) {
        fabric.Image.fromURL(url, function(img) {
            img.scaleToWidth(canvas.width * 0.3); // 初始大小設為畫布的 30%
            img.set({
                left: 50,
                top: 50,
                cornerColor: 'rgba(0,0,255,0.5)',
                transparentCorners: false,
                cornerSize: 24 
            });
            canvas.add(img);
            canvas.setActiveObject(img);
        }, { crossOrigin: 'anonymous' });
    }

    // 3. 高解析度下載與分享功能
    function getHighResDataURL() {
        // 計算倍率：原始寬度 / 目前畫布寬度
        const zoom = originalWidth / canvas.width;
        
        return canvas.toDataURL({
            format: 'png',
            multiplier: zoom, // 關鍵：這會讓輸出後的圖片回到原始解析度
            quality: 1
        });
    }

    document.getElementById('download-btn').onclick = () => {
        if (!originalWidth) return alert("請先上傳照片");
        const dataURL = getHighResDataURL();
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'high-res-photo.png';
        link.click();
    };

    document.getElementById('share-btn').onclick = async () => {
        if (!originalWidth) return alert("請先上傳照片");
        const dataURL = getHighResDataURL();
        const blob = await (await fetch(dataURL)).blob();
        const file = new File([blob], 'high-res-photo.png', { type: 'image/png' });

        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: '我的高畫質作品',
                    //text: '這張是用原始解析度合成的喔！'
                });
            } catch (err) { console.log('分享失敗', err); }
        } else {
            alert('瀏覽器不支援分享，請使用儲存功能。');
        }
    };
</script>

</body>
</html>
