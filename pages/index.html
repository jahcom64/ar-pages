<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰化監理站專案整合首頁</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            padding-bottom: 50px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            background-color: #fafafa;
        }

        .card i {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .card span {
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* 響應式調整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>彰化監理站專案導覽面板</h1>
        <p>請選擇下方項目進入對應網頁</p>
    </header>

    <div class="container">
        <a href="https://jahcom64.github.io/ar-pages/carOpacityTest/index.html" class="card">
            <i class="fas fa-car"></i>
            <span>車輛透光率挑戰賽</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/elecFindError/index.html" class="card">
            <i class="fas fa-bolt"></i>
            <span>大家來找碴：微型電動二輪車篇</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/lightTest/index.html" class="card">
            <i class="fas fa-lightbulb"></i>
            <span>號誌挑戰賽</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/simPaper/index.html" class="card">
            <i class="fas fa-file-lines"></i>
            <span>汽車隔熱紙透光度對照模擬器</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/index.html" class="card">
            <i class="fas fa-layer-group"></i>
            <span>微電車AR體驗</span>
        </a>
    </div>

</body>
</html>
