<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰化監理站專案整合首頁</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            padding-bottom: 50px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* --- 自製圖示樣式設定 --- */
        .card img {
            width: 80px;      /* 設定圖片寬度 */
            height: 80px;     /* 設定圖片高度 */
            object-fit: contain; /* 確保圖片不變形 */
            margin-bottom: 20px;
        }

        .card span {
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>彰化監理站專案導覽面板</h1>
    </header>

    <div class="container">
        <a href="https://jahcom64.github.io/ar-pages/carOpacityTest/index.html" class="card">
            <img src="icon-car.png" alt="車輛透光率挑戰賽">
            <span>車輛透光率挑戰賽</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/elecFindError/index.html" class="card">
            <img src="icon-elec.png" alt="大家來找碴：微型電動二輪車篇">
            <span>大家來找碴：微型電動二輪車篇</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/lightTest/index.html" class="card">
            <img src="icon-light.png" alt="號誌挑戰賽">
            <span>號誌挑戰賽</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/simPaper/index.html" class="card">
            <img src="icon-paper.png" alt="汽車隔熱紙透光度對照模擬器">
            <span>汽車隔熱紙透光度對照模擬器</span>
        </a>

        <a href="https://jahcom64.github.io/ar-pages/index.html" class="card">
            <img src="icon-ar.png" alt="微電車AR體驗">
            <span>微電車AR體驗</span>
        </a>
    </div>
