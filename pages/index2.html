<!DOCTYPE html>
<html>
<head>
  <title>彰化監理站專案導覽面板</title>
  <style>
    /* 全域設定 */
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    /* 頂部大標題樣式 */
    .header-title {
      width: 100%;
      text-align: center;
      padding: 30px 0 10px 0;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      letter-spacing: 1px;
    }

    .game-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      padding: 20px 10px;
      justify-content: flex-start;
    }

    .game-card {
      position: relative;
      flex: 1 1 calc(33.333% - 25px); 
      min-width: 280px;
      max-width: calc(33.333% - 25px);
      aspect-ratio: 4 / 3; 
      border-radius: 30px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      border: 3px solid #f0f0f0;
      background-color: #ffffff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    /* 鎖定樣式 */
    .game-card[href="#"] {
      cursor: not-allowed;
      pointer-events: none;
    }

    .game-card[href="#"] img {
      filter: grayscale(1) brightness(0.6);
    }

    /* COMING SOON 置中修正 */
    .game-card[href="#"]::after {
      content: "COMING SOON";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      border: 2px solid white;
      padding: 8px 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      z-index: 2;
      white-space: nowrap;
    }

    /* 響應式佈局 */
    @media (max-width: 900px) {
      .game-card { flex: 1 1 calc(50% - 25px); max-width: calc(50% - 25px); }
      .header-title { font-size: 24px; }
    }
    @media (max-width: 600px) {
      .game-card { flex: 1 1 100%; max-width: 100%; }
      .header-title { font-size: 20px; padding: 20px 0 5px 0; }
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      transition: transform 0.5s ease;
    }

    .game-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      color: white;
      padding: 40px 15px 15px; 
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    /* --- 桌面版功能 --- */
    @media (hover: hover) {
      .game-info { opacity: 0; }
      .game-card:not([href="#"]):hover .game-info { opacity: 1; }
      .game-card:not([href="#"]):hover {
        border-color: #64B5F6;
        box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        transform: translateY(-8px);
      }
      .game-card:not([href="#"]):hover img { transform: scale(1.1); }
    }

    /* --- 手機/觸控版功能 --- */
    @media (hover: none) {
      .game-info { opacity: 1; }
      .game-card { transform: none !important; }
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 40px 0 20px;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #eee;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header-title">
    彰化監理站專案導覽面板
  </div>

  <div class="game-grid">
    <a href="https://jahcom64.github.io/ar-pages/carOpacityTest/index.html" target="_blank" class="game-card">
      <img src="圖片網址1" alt="車輛透光率挑戰賽">
      <div class="game-info">車輛透光率挑戰賽</div>
    </a>

    <a href="https://jahcom64.github.io/ar-pages/elecFindError/index.html" target="_blank" class="game-card">
      <img src="圖片網址2" alt="大家來找碴：微型電動二輪車篇">
      <div class="game-info">大家來找碴：微電車篇</div>
    </a>

    <a href="https://jahcom64.github.io/ar-pages/lightTest/index.html" class="game-card">
      <img src="圖片網址3" alt="號誌挑戰賽">
      <div class="game-info">號誌挑戰賽</div>
    </a>

    <a href="https://jahcom64.github.io/ar-pages/simPaper/index.html" class="game-card">
      <img src="圖片網址4" alt="隔熱紙透光度模擬器">
      <div class="game-info">隔熱紙透光度模擬器</div>
    </a>

    <a href="https://jahcom64.github.io/ar-pages/index.html" class="game-card">
      <img src="圖片網址5" alt="微電車AR交通宣導-左轉彎未依規定">
      <div class="game-info">微電車AR交通宣導-左轉彎未依規定</div>
    </a>
    <a href="https://jahcom64.github.io/ar-pages/index.html" class="game-card">
      <img src="圖片網址5" alt="微電車AR交通宣導-未依規定讓車">
      <div class="game-info">微電車AR交通宣導-未依規定讓車</div>
    </a>
    <a href="#" class="game-card">
      <img src="圖片網址6" alt="交安標誌消消樂">
      <div class="game-info">交安標誌消消樂</div>
    </a>

    <div class="footer">
      臺中區監理所彰化監理站 © 2026為民服務專案網站
    </div>
  </div>

</body>
</html>
