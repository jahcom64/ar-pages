<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>汽車隔熱紙透光率教學宣導</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f6f7;
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overscroll-behavior: none; 
            user-select: none; /* 防止拖曳時選取到文字 */
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        p.desc {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 20px;
            max-width: 600px;
            font-size: 0.9rem;
        }

        /* --- 選項區域 --- */
        .options-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .draggable-item {
            width: 70px;
            height: 45px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: grab; /* 電腦版游標 */
            font-size: 1rem;
            touch-action: none; 
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        /* 拖曳時的「分身」樣式 */
        .dragging-clone {
            position: fixed;
            z-index: 9999;
            pointer-events: none; /* 讓分身不擋住下方的偵測 */
            width: 80px;
            height: 50px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            opacity: 0.8;
            transform: scale(1.1) rotate(2deg); /* 稍微傾斜增加動態感 */
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            border: 2px solid white;
        }

        /* --- 汽車示意圖區域 --- */
        .car-container {
            position: relative;
            width: 300px;
            height: 470px;
            background-color: #f0a1c3;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .car-container::before {
            content: '';
            position: absolute;
            top: -10px;
            width: 80%;
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(to right, #f1c40f 20%, transparent 20%, transparent 80%, #f1c40f 80%);
        }

        .drop-zone {
            width: 220px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 2px dashed #7f8c8d;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            transition: all 0.2s;
        }

        /* 當拖曳物在上方時的樣式 */
        .drop-zone.active-target {
            background-color: rgba(52, 152, 219, 0.4);
            border: 2px solid var(--accent-color);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
        }

        .drop-zone span.label {
            font-weight: bold;
            font-size: 1.2em;
            color: #555;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .drop-zone .content {
            font-size: 0.8em;
            color: var(--primary-color);
            pointer-events: none;
        }

        /* 車窗位置微調 */
        #zone-front-windshield { margin-top: 40px; height: 80px; border-radius: 15px 15px 5px 5px; }
        #zone-front-side { width: 260px; }
        #zone-rear-side { width: 260px; }
        #zone-rear-windshield { height: 60px; border-radius: 5px 5px 15px 15px; }

        /* --- 驗證狀態 --- */
        .drop-zone.correct {
            background-color: rgba(39, 174, 96, 0.3);
            border: 2px solid var(--success-color);
        }
        .drop-zone.wrong {
            background-color: rgba(231, 76, 60, 0.3);
            border: 2px solid var(--error-color);
        }

        /* --- 按鈕區域 --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            touch-action: manipulation;
        }

        #check-btn { background-color: var(--primary-color); color: white; }
        #check-btn:active { background-color: #1a252f; transform: scale(0.95); }
        #check-btn:hover { background-color: #34495e; }

        #reset-btn { background-color: #95a5a6; color: white; }
        #reset-btn:active { background-color: #7f8c8d; transform: scale(0.95); }
        #reset-btn:hover { background-color: #7f8c8d; }

        #result-msg {
            margin-top: 10px;
            margin-bottom: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-car"></i> 一般車輛隔熱紙透光率測驗</h1>
    <p class="desc">請問各車窗應採用透光率多少以上的隔熱紙?</p>
    <p class="desc">請拖曳選項至車輛對應位置。</p>

    <div class="options-container">
        <div class="draggable-item" data-value="90%">90%</div>
        <div class="draggable-item" data-value="70%">70%</div>
        <div class="draggable-item" data-value="40%">40%</div>
        <div class="draggable-item" data-value="10%">10%</div>
        <div class="draggable-item" data-value="皆可">皆可</div>
    </div>

    <div class="car-container">
        <div class="drop-zone" id="zone-front-windshield" data-answer="70%">
            <span class="label">前擋風玻璃</span>
            <div class="content">請拖曳正確選項至此</div>
        </div>
        <div class="drop-zone" id="zone-front-side" data-answer="40%">
            <span class="label">前側窗 (駕駛/副駕)</span>
            <div class="content">請拖曳正確選項至此</div>
        </div>
        <div class="drop-zone" id="zone-rear-side" data-answer="皆可">
            <span class="label">後側窗</span>
            <div class="content">請拖曳正確選項至此</div>
        </div>
        <div class="drop-zone" id="zone-rear-windshield" data-answer="皆可">
            <span class="label">後擋風玻璃</span>
            <div class="content">請拖曳正確選項至此</div>
        </div>
    </div>

    <div class="controls">
        <button id="check-btn" onclick="checkAnswers()">檢查結果</button>
        <button id="reset-btn" onclick="resetGame()">重置</button>
    </div>
    <div id="result-msg"></div>

    <script>
        // --- 變數初始化 ---
        const draggables = document.querySelectorAll('.draggable-item');
        const dropZones = document.querySelectorAll('.drop-zone');
        const resultMsg = document.getElementById('result-msg');
        let activeClone = null; // 儲存當前拖曳的分身
        let isDragging = false;

        // --- 綁定事件 (同時支援 滑鼠 與 觸控) ---
        draggables.forEach(item => {
            // 滑鼠
            item.addEventListener('mousedown', startDrag);
            // 觸控
            item.addEventListener('touchstart', startDrag, { passive: false });
        });

        // --- 拖曳邏輯核心 ---

        function startDrag(e) {
            e.preventDefault(); // 防止選取文字或捲動

            // 1. 取得座標 (正規化 滑鼠/觸控 差異)
            const { x, y } = getEventCoords(e);
            const originalItem = e.target;

            // 2. 建立分身 (Clone)
            activeClone = originalItem.cloneNode(true);
            activeClone.classList.add('dragging-clone');
            document.body.appendChild(activeClone);

            // 3. 設定分身位置 (讓中心點對準游標)
            moveClone(x, y);

            isDragging = true;

            // 4. 綁定全域移動與結束事件
            // 綁在 document 上，這樣拖曳太快超出範圍也不會斷掉
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);

            // 震動回饋 (僅手機)
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function onMove(e) {
            if (!isDragging || !activeClone) return;
            e.preventDefault(); // 防止手機畫面捲動

            const { x, y } = getEventCoords(e);

            // 移動分身
            moveClone(x, y);

            // 偵測並高亮下方的框框
            detectDropZone(x, y);
        }

        function onEnd(e) {
            if (!isDragging || !activeClone) return;

            // 取得最後的座標 (touchend 的 touches 是空的，要用 changedTouches)
            let x, y;
            if (e.type === 'touchend') {
                x = e.changedTouches[0].clientX;
                y = e.changedTouches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            // 檢查是否在框框內
            // 技巧：先隱藏 clone 才能用 elementFromPoint 穿透它偵測下面
            activeClone.style.display = 'none';
            const elemBelow = document.elementFromPoint(x, y);
            activeClone.style.display = 'flex'; // (雖然馬上要移除了，但保持邏輯完整)

            if (elemBelow) {
                const dropZone = elemBelow.closest('.drop-zone');
                if (dropZone) {
                    const value = activeClone.getAttribute('data-value');
                    updateZone(dropZone, value);
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            }

            // 清理垃圾與事件
            cleanup();
        }

        // --- 輔助函式 ---

        function getEventCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function moveClone(x, y) {
            if (activeClone) {
                activeClone.style.left = (x - activeClone.offsetWidth / 2) + 'px';
                activeClone.style.top = (y - activeClone.offsetHeight / 2) + 'px';
            }
        }

        function detectDropZone(x, y) {
            // 暫時隱藏 Clone 以便「穿透」偵測
            activeClone.style.display = 'none';
            const elemBelow = document.elementFromPoint(x, y);
            activeClone.style.display = 'flex';

            // 清除所有舊的高亮
            dropZones.forEach(z => z.classList.remove('active-target'));

            if (elemBelow) {
                const zone = elemBelow.closest('.drop-zone');
                if (zone) {
                    zone.classList.add('active-target');
                }
            }
        }

        function cleanup() {
            if (activeClone) {
                activeClone.remove();
                activeClone = null;
            }
            isDragging = false;
            // 移除全域監聽
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            // 清除高亮
            dropZones.forEach(z => z.classList.remove('active-target'));
        }

        // --- 遊戲邏輯 ---

        function updateZone(zone, value) {
            zone.classList.remove('correct', 'wrong');
            const contentDiv = zone.querySelector('.content');
            contentDiv.textContent = value;
            zone.setAttribute('data-current', value);
        }

        function checkAnswers() {
            let allCorrect = true;
            let allFilled = true;

            dropZones.forEach(zone => {
                const userAnswer = zone.getAttribute('data-current');
                const correctAnswer = zone.getAttribute('data-answer');

                if (!userAnswer) {
                    allFilled = false;
                    return;
                }

                if (userAnswer === correctAnswer) {
                    zone.classList.add('correct');
                    zone.classList.remove('wrong');
                } else {
                    zone.classList.add('wrong');
                    zone.classList.remove('correct');
                    allCorrect = false;
                }
            });

            if (!allFilled) {
                resultMsg.textContent = "請填滿所有選項再檢查喔！";
                resultMsg.style.color = "#e67e22";
            } else if (allCorrect) {
                resultMsg.innerHTML = "<i class='fas fa-check-circle'></i> 恭喜！完全正確！符合法規標準。";
                resultMsg.style.color = "#27ae60";
            } else {
                resultMsg.innerHTML = "<i class='fas fa-times-circle'></i> 部分錯誤，請依照括號內的提示再試一次。";
                resultMsg.style.color = "#c0392b";
            }
        }

        function resetGame() {
            dropZones.forEach(zone => {
                zone.classList.remove('correct', 'wrong', 'active-target');
                zone.removeAttribute('data-current');
                zone.querySelector('.content').textContent = "請拖曳";
            });
            resultMsg.textContent = "";
        }
    </script>
</body>
</html>
